ekf_filter_node_local:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom           # 🌟 局部：基準是 odom
    publish_tf: true            # 🌟 負責發布 odom -> base_link

    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

ekf_filter_node_global:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map            # 🌟 全域：基準是 map
    publish_tf: true            # 🌟 負責發布 map -> odom
    
    initial_state: [0.0,  0.0,  0.0,   # X,  Y,  Z
                    0.0,  0.0,  0.0,   # Roll, Pitch, Yaw
                    0.0,  0.0,  0.0,   # dX, dY, dZ
                    0.0,  0.0,  0.0,   # dRoll, dPitch, dYaw
                    0.0,  0.0,  0.0]  # ddX, ddY, ddZ

    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   false,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    pose0: /localization/pose_with_covariance  # 聽 NDT
    pose0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_queue_size: 10
    pose0_differential: false
